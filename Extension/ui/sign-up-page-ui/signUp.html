<div class="auth-page">

    <div class="auth-main-container">

        <div class="auth-name-logo">
            <div class="halo-logo"></div>
            <h2>Halo AI</h2>
        </div>

        <button class="auth-close-btn">X</button>

        <!-- LOGIN FORM-->

        <div class="login-form">

            <h3>Login to your Account</h3>

            <input id="login-username" type="username" placeholder="Username">
            <input id="login-password" type="password" placeholder="Password">

            <button class="login-submit-btn">Login</button>

            <p>
                New user?
                <button class="show-signup-page-btn">Create Account</button>
            </p>

        </div>

        <!-- SIGNUP FORM -->
        
        <div class="signup-form" style="display:none">

            <h3>Create your Account</h3>

            <input id="signup-username" type="text" placeholder="Full name">
            <input id="signup-email" type="email" placeholder = "Email">
            <input id="signup-password" type="password" placeholder="password">

            <button class="signup-submit-btn">Sign Up</button>

            <p>
                Already have an Account?
                <button class="show-login-page-btn">Login</button>
            </p>

        </div>


    </div>
</div>
