<div class="signup-page">
    <div class="auth-main-container">
        <div class="signup-name-logo">
            <div class="signup-logo"></div>
            <h2 class="signup-name">Halo AI</h2>
        </div>

        <button class="signup-close-btn">X</button>

        <div class="auth-sign-in">
            <div class="auth-email-password">
                <h3>Enter your Email and Password</h3>
                <input id="auth-email" type="email" placeholder="email">
                <input id="auth-password" type="password" placeholder="password">
            </div>
            <div class="auth-submition">
                <button class="auth-submit-btn">Sign Up</button>
            </div>

            <div class="login">
                <p>Already have an Account</p>
                <button class="login-btn">Login</button>
            </div>
        </div>
    </div>
    <div class="auth-footer"></div>
</div>
