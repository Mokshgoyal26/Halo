<div class="main-container">

    <!-- secondary visible button which also remain visible in idle state but hidden while dragging-->
    <div class="secondary-visible-btn">
        <button class="summarize-btn">
            <img class="summarize-btn-icon">
        </button>
        <div class="summarize-btn-tooltip">Summarize this page</div>
    </div>

    <!-- Always visible + drag handle -->
    <div class="main-button">
            <button class="open-sidebar-btn">
                <img class="open-sidebar-btn-icon">
            </button>
            <div class="open-sidebar-btn-tooltip">Ask Ai anything</div>
    </div>

    <!-- Hidden by default, revealed on click -->
    <div class="action-buttons">
        <div class="Translate-btn-wrapper">
            <button class="Translate-page-btn">
                <img class="Translate-page-btn-icon">
            </button>
            <div class="Translate-btn-tooltip">Translate this page</div>
        </div>
        <div class="Hide-btn-wrapper">
            <button class="Hide-btn">
                <img class="Hide-btn-icon">
            </button>
            <div class="Hide-btn-tooltip">Hide until next visit</div>
        </div>
    </div>
</div>
