
<div class="sidebar-extension-container">
    <div class="sidebar-header-container">
        <div class="header-left-container">
            <div class="logo"></div>
            <div class="extension-name">Halo</div>
        </div>
        <div class="header-right-container">

            <div class="tooltip-wrapper">
                <button class="new-chat-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg></button>
                <span class="tooltip">New Chat</span>
            </div>

            <button class="dropdown-trigger">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </button>

            <button class="open-signup-page">Sign in</button>

            <button class="close-btn">
                <img class="close-btn-icon">
            </button>
        </div>
    </div>

    <div class="sidebar-main-container">
        <div  class="sidebar-scroll-wrapper">
            <div class="sidebar-content-div">
                <div class="empty-state-container">
                    <div class="empty-state-header">
                        <div class="empty-state-logo"></div>
                        <div class="empty-state-title">Hi👋</div>
                    </div>
                    <div class="empty-state-intro">How can i help you ?</div>
                    <div class="suggestions-buttons-div">
                        <!--<button class="suggestion-btn">write anything</button>
                        <button class="suggestion-btn">summarize</button>
                        <button class="suggestion-btn">Explain this section</button>-->
                    </div>
                </div>
                <!-- this is content div-->
                <div class="content-state">
                    <!-- dynamic content will be injected here -->
                </div>
                
            </div>

            <div class="sidebar-fade-content-div"></div> 

        </div>
    </div>

    <div class="sidebar-footer-container">
        <div class="input-wrapper">
    
            <textarea class="text-input" placeholder="Ask anything..." rows="1"></textarea>
    
            <div class="input-actions">
                <div class="left-actions">
    
                    <button class="model-btn active" data-model="gpt-4o">
                        <span class="model-name">GPT-4o</span>
                    </button>
                    <button class="model-btn" data-model="claude-sonnet">
                        <span class="model-name">Claude Sonnet</span>
                    </button>
                    <button class="model-btn" data-model="gemini-pro">
                        <span class="model-name">Gemini Pro</span>
                    </button>
    
                </div>
    
                <div class="right-actions">
                    <button class="upload-btn">
                        <img class="upload-btn-icon">
                    </button>
                    <button class="send-btn">
                        <img class="send-btn-icon">
                    </button>
                </div>
            </div>
    
        </div>
    </div>
</div>
